<div class="min-h-screen flex flex-col bg-gray-50 text-gray-900">
  <!-- NAVBAR -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <nav class="max-w-6xl mx-auto p-4">
      <div class="flex items-center justify-between">
        <a routerLink="/" class="font-semibold text-lg text-indigo-600">
          Angular Forms Workshop
        </a>

        <!-- Desktop links -->
        <ul class="hidden md:flex items-center gap-6 text-sm">
          <li><a routerLink="/signup" routerLinkActive="text-indigo-600 font-medium">Signup form</a></li>
          <li><a routerLink="/dynamic" routerLinkActive="text-indigo-600 font-medium">Groups & Dynamic Fields</a></li>
          <li><a routerLink="/validators" routerLinkActive="text-indigo-600 font-medium">Validators</a></li>
        </ul>

        <!-- Hamburger (mobile) -->
        <button type="button"
          class="md:hidden inline-flex items-center justify-center rounded-lg border border-gray-200 p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          aria-label="Toggle navigation menu" aria-controls="mobile-menu" [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()">
          <!-- Icon: 3 lines / X based on state -->
          @if(!menuOpen()) {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          } @else {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" d="M6 6l12 12M18 6l-12 12" />
          </svg>
          }
        </button>
      </div>

      <!-- Mobile menu panel -->
      <div id="mobile-menu" class="md:hidden transition-all duration-200" [class.hidden]="!menuOpen()">
        <ul class="mt-3 space-y-2 rounded-lg border border-gray-200 bg-white p-3 shadow-sm">
          <li><a routerLink="/lab1" routerLinkActive="text-indigo-600 font-medium"
              class="block rounded px-3 py-2 hover:bg-gray-50">Lab 1</a></li>
          <li><a routerLink="/lab2" routerLinkActive="text-indigo-600 font-medium"
              class="block rounded px-3 py-2 hover:bg-gray-50">Lab 2</a></li>
          <li><a routerLink="/lab3" routerLinkActive="text-indigo-600 font-medium"
              class="block rounded px-3 py-2 hover:bg-gray-50">Lab 3</a></li>
          <li><a routerLink="/lab4" routerLinkActive="text-indigo-600 font-medium"
              class="block rounded px-3 py-2 hover:bg-gray-50">Lab 4 (CVA)</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- MAIN -->
  <main class="flex-1">
    <div class="max-w-5xl mx-auto p-6">
      <router-outlet />
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-gray-200 text-sm mt-10">
    <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <p>© 2025 Angular Forms Workshop - Jitse &amp; Michaël</p>
      <div class="flex gap-3">
        <a href="https://angular.dev" target="_blank" class="hover:text-white">Angular Docs</a>
        <a href="https://tailwindcss.com" target="_blank" class="hover:text-white">Tailwind</a>
        <a href="https://github.com/" target="_blank" class="hover:text-white">GitHub</a>
      </div>
    </div>
  </footer>
</div>
