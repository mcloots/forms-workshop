<form #f="ngForm" (ngSubmit)="save()" class="max-w-xl mx-auto space-y-5">
    <fieldset ngModelGroup="address" class="space-y-3 border border-gray-200 p-4 rounded-xl">
        <legend class="font-medium text-gray-800">Address</legend>

        <div>
            <label class="block text-sm font-medium text-gray-700" for="street">Street</label>
            <input id="street" name="street" [(ngModel)]="model.street" required
                class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700" for="city">City</label>
                <input id="city" name="city" [(ngModel)]="model.city" required
                    class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700" for="zip">ZIP</label>
                <input id="zip" name="zip" [(ngModel)]="model.zip" pattern="\d{4,6}"
                    class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500" />
            </div>
        </div>

        <!-- Dynamic Extra Lines -->
        <div class="pt-2">
            <h4 class="text-sm font-semibold text-gray-700 mb-2">Extra lines</h4>

            @for (line of model.extraLines; track $index) {
            <input [name]="'extra-' + $index" [(ngModel)]="model.extraLines[$index]"
                placeholder="Extra line {{ $index + 1 }}"
                class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm mb-2 focus:ring-2 focus:ring-indigo-500" />
            }

            <div class="flex gap-2">
                <button type="button" (click)="addLine()"
                    class="rounded-lg border border-gray-300 bg-white px-3 py-1 text-sm hover:bg-gray-50">
                    + Add line
                </button>
                <button type="button" (click)="removeLastLine()" [disabled]="!model.extraLines.length"
                    class="rounded-lg border border-gray-300 bg-white px-3 py-1 text-sm hover:bg-gray-50 disabled:opacity-50">
                    - Remove last
                </button>
            </div>
        </div>
    </fieldset>

    <button type="submit" [disabled]="f.invalid"
        class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-500 disabled:opacity-50">
        Save
    </button>
</form>
